<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diseñador de Espacios</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232f7df6' d='M12 3 2 11h3v9h6v-6h2v6h6v-9h3z'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 3 2 11h3v9h6v-6h2v6h6v-9h3z" /></svg>
        <span>Diseñador de Espacios</span>
      </div>
      <input id="projectName" class="project-name" spellcheck="false" title="Nombre del proyecto" />
      <div class="group">
        <button id="btnNew" class="btn ghost" title="Nuevo proyecto vacío">Nuevo</button>
        <div class="dropdown">
          <button class="btn ghost" data-menu="templatesMenu">Plantillas ▾</button>
          <div class="menu" id="templatesMenu"></div>
        </div>
        <button id="btnImportPlan" class="btn accent" title="Importar un plano (imagen o PDF) y crear el proyecto a partir de él. También puedes soltar el archivo sobre el plano.">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 4h16v16H4zM4 12h7v8M11 12V4M15 4v5h5" /></svg>
          Importar plano
        </button>
        <button id="btnOpen" class="btn ghost" title="Abrir un proyecto (.json)">Abrir</button>
        <button id="btnSave" class="btn ghost" title="Guardar proyecto (Ctrl+S)">Guardar</button>
        <div class="dropdown">
          <button class="btn ghost" data-menu="exportMenu">Exportar ▾</button>
          <div class="menu" id="exportMenu">
            <button data-export="png2d"><strong>Plano 2D</strong><small>Imagen PNG del plano</small></button>
            <button data-export="png3d"><strong>Vista 3D</strong><small>Captura PNG de la vista 3D</small></button>
            <button data-export="json"><strong>Proyecto</strong><small>Archivo .json para volver a abrirlo</small></button>
          </div>
        </div>
        <input type="file" id="fileInput" accept=".json,application/json" hidden />
      </div>
      <div class="group">
        <button id="btnUndo" class="btn icon" title="Deshacer (Ctrl+Z)">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></svg>
        </button>
        <button id="btnRedo" class="btn icon" title="Rehacer (Ctrl+Y)">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m15 14 5-5-5-5M20 9H9.5a5.5 5.5 0 0 0 0 11H13" /></svg>
        </button>
      </div>
      <div class="spacer"></div>
      <div class="segmented" id="viewMode">
        <button data-view="2d" class="active">Plano 2D</button>
        <button data-view="split">Dividida</button>
        <button data-view="3d">Vista 3D</button>
      </div>
    </header>

    <div class="app">
      <aside class="sidebar left">
        <section class="tools">
          <h3>Herramientas</h3>
          <div class="tool-grid">
            <button class="tool active" data-tool="select" title="Seleccionar y mover (V)">
              <svg viewBox="0 0 24 24"><path fill="currentColor" d="M5 3l14 8-6 1.5L16 20l-2.5 1-3-7.5L6 18z" /></svg>
              <span>Seleccionar</span>
            </button>
            <button class="tool" data-tool="wall" title="Dibujar muros (M)">
              <svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="miter" d="M4 20V6h16" /><circle cx="4" cy="20" r="2" fill="currentColor" /><circle cx="20" cy="6" r="2" fill="currentColor" /></svg>
              <span>Muro</span>
            </button>
            <button class="tool" data-tool="room" title="Habitación rectangular con muros (H)">
              <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" fill="none" stroke="currentColor" stroke-width="2.5" /><path d="M9 19v-4h4" fill="none" stroke="currentColor" stroke-width="1.5" /></svg>
              <span>Habitación</span>
            </button>
            <button class="tool" data-tool="measure" title="Medir distancias (D)">
              <svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M3 17 17 3l4 4L7 21z M7 13l2 2 M10 10l2 2 M13 7l2 2" /></svg>
              <span>Medir</span>
            </button>
            <button class="tool wide" data-tool="scale" title="Corregir la escala del plano con una medida conocida (K)">
              <svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 21 21 3M14 3h7v7M3 14v7h7" /></svg>
              <span>Corregir escala</span>
            </button>
          </div>
        </section>
        <section class="catalog">
          <h3>Catálogo</h3>
          <input id="catalogSearch" class="search" placeholder="Buscar mueble…" />
          <div id="catalogList"></div>
        </section>
      </aside>

      <main class="viewport" id="viewport" data-view="2d">
        <div class="pane pane-2d" id="pane2d">
          <canvas id="canvas2d"></canvas>
          <div class="zoom-ctrl">
            <button id="zoomIn" title="Acercar">+</button>
            <button id="zoomOut" title="Alejar">−</button>
            <button id="zoomFit" title="Encuadrar todo (F)">⤢</button>
          </div>
        </div>
        <div class="pane pane-3d" id="pane3d">
          <div class="overlay3d">
            <button id="btn3dFit" class="pill">Encuadrar</button>
            <label class="pill"><input type="checkbox" id="chkLowWalls" /> Muros bajos</label>
            <button id="btnWalk" class="pill primary">Recorrido virtual</button>
          </div>
          <div id="walkHint" class="walk-hint" hidden>W A S D para caminar · ratón para mirar · Shift para correr · Esc para salir</div>
        </div>
      </main>

      <aside class="sidebar right" id="props"></aside>
    </div>

    <footer class="statusbar">
      <span id="statusHint"></span>
      <span class="spacer"></span>
      <span id="statusCoords"></span>
      <span id="statusZoom"></span>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
